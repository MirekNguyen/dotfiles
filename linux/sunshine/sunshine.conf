# Sunshine - game streaming host for Moonlight.
# Started from hypr/hyprland/autostart.lua with this file as its config path.

# Capture straight from Hyprland (wlr-screencopy)
capture = wlr
output_name = HDMI-A-1
# HDMI-A-1 is a dummy plug, disabled outside of streams (hypr monitors.lua).
global_prep_cmd = [{"do":"sh -c \"$HOME/.config/dotfiles/linux/sunshine/display.sh stream\"","undo":"sh -c \"$HOME/.config/dotfiles/linux/sunshine/display.sh desktop\""}]

gamepad = x360
upnp = enabled
fec_percentage = 35
key_rightalt_to_key_win = enabled
nvenc_preset = 7
sw_preset = ultrafast
