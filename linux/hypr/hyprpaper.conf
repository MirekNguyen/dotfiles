# hyprpaper - wallpaper daemon, started from hyprland/autostart.lua.
# hyprpaper 0.8+ syntax: the old `preload =` / `wallpaper = mon,path` lines are
# silently ignored. An empty monitor applies to every output.

splash = false

wallpaper {
    monitor =
    path = ~/.config/dotfiles/linux/wallpapers/waneella-street-night.jpg
    fit_mode = cover
}
