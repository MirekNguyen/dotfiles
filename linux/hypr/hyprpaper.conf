# hyprpaper - wallpaper daemon, started from hyprland/autostart.lua.
# hyprpaper 0.8+ syntax: the old `preload =` / `wallpaper = mon,path` lines are
# silently ignored. An empty monitor applies to every output.

splash = false

# Rotates through the wallpapers folder in random order, one every 30 minutes.
# recursive stays off so the plain gradients in wallpapers/gradients/ are
# left out.
wallpaper {
    monitor =
    path = ~/.config/dotfiles/linux/wallpapers
    fit_mode = cover
    timeout = 1800
    order = random
}
