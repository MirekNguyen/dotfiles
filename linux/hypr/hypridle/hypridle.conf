general {
    # Target of `loginctl lock-session`
    # pidof guard: never stack two lock screens.
    lock_cmd = pidof hyprlock || hyprlock -c ~/.config/hypr/hyprlock/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# display off. Any input brings it back, no password.
listener {
    timeout = 1200 # 20 min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# lock with grace means input right as it locks still gets you in
listener {
    timeout = 1800 # 30 min
    on-timeout = pidof hyprlock || hyprlock -c ~/.config/hypr/hyprlock/hyprlock.conf --grace 10 # 10s grace period
}
