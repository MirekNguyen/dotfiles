# hyprlock - lock screen, style: big clock up top, frosted password

source = ~/.config/hypr/hyprlock/colors.conf

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 4, ease
    animation = fadeOut, 1, 4, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    path = ~/.config/dotfiles/linux/wallpapers/waneella-street-night.jpg
    blur_passes = 3
    blur_size = 8
    brightness = $bg_bright
    vibrancy = 0.2
}

# TIME
label {
    monitor =
    text = $TIME
    font_size = 110
    font_family = Adwaita Sans Bold
    color = $fg
    shadow_passes = 2
    shadow_size = 4

    position = 0, -180
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    font_size = 24
    font_family = Adwaita Sans
    color = $fg_dim

    position = 0, -130
    halign = center
    valign = top
}

input-field {
    monitor =
    size = 320, 52
    rounding = -1
    outline_thickness = 1
    inner_color = $glass_bg
    outer_color = $glass_edge
    check_color = $check
    fail_color = $fail
    font_color = $fg
    font_family = Adwaita Sans

    fade_on_empty = false
    placeholder_text = Enter Password
    fail_text = $PAMFAIL
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true

    position = 0, 140
    halign = center
    valign = bottom
}

# USER
label {
    monitor =
    text = $USER
    font_size = 16
    font_family = Adwaita Sans
    color = $fg_dim

    position = 0, 210
    halign = center
    valign = bottom
}
