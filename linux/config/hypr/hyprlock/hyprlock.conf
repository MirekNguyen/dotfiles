# hyprlock - lock screen, style: big clock up top, frosted password
#
# One palette for both light and dark mode, as on the macOS lock screen: white
# text over a dimmed wallpaper. Following light mode gave near-black text on
# the (dark) wallpaper, which was unreadable.

$glass_bg   = rgba(30, 30, 32, 0.45)
$glass_edge = rgba(255, 255, 255, 0.20)
$fg         = rgba(255, 255, 255, 1.0)
$fg_dim     = rgba(255, 255, 255, 0.80)
$check      = rgba(10, 132, 255, 0.85)
$fail       = rgba(255, 69, 58, 0.85)
$font       = Adwaita Sans

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 4, ease
    animation = fadeOut, 1, 4, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    path = ~/Pictures/wallpapers/linux/waneella-street-night.jpg
    blur_passes = 3
    blur_size = 8
    brightness = 0.70
    vibrancy = 0.2
}

# DATE (above the time, as on macOS)
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    font_size = 28
    font_family = $font Semibold
    color = $fg_dim
    shadow_passes = 2
    shadow_size = 4

    position = 0, -120
    halign = center
    valign = top
}

# TIME
label {
    monitor =
    text = $TIME
    font_size = 120
    font_family = $font Bold
    color = $fg
    shadow_passes = 2
    shadow_size = 4

    position = 0, -170
    halign = center
    valign = top
}

# USER
label {
    monitor =
    text = $USER
    font_size = 20
    font_family = $font Semibold
    color = $fg
    shadow_passes = 2
    shadow_size = 4

    position = 0, 220
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 360, 60
    rounding = -1
    outline_thickness = 1
    inner_color = $glass_bg
    outer_color = $glass_edge
    check_color = $check
    fail_color = $fail
    font_color = $fg
    font_family = $font

    fade_on_empty = false
    placeholder_text = <span foreground="##ffffffcc">Enter Password</span>
    fail_text = $PAMFAIL
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true

    position = 0, 140
    halign = center
    valign = bottom
}
