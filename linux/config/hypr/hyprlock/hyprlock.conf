# hyprlock - lock screen: stacked clock in the middle, day and date under it,
# capsule password field near the bottom.
#
# One palette for both light and dark mode, as on the macOS lock screen: white
# text over a dimmed wallpaper.
#
# hyprlock works in physical pixels (size, outline) and font_size is in points
# at 96 dpi, also physical: the monitor runs at scale 2, so everything here is
# double its logical size. Positions are in % of the screen so the layout holds
# at any resolution.

$fg        = rgba(255, 255, 255, 0.90)
$fg_dim    = rgba(255, 255, 255, 0.75)
$font      = Adwaita Sans

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 4, ease
    animation = fadeOut, 1, 4, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    path = ~/Pictures/wallpapers/linux/waneella-street-night.jpg
    blur_passes = 3
    blur_size = 10
    brightness = 0.70
    vibrancy = 0.2
}

# HOURS
label {
    monitor =
    text = cmd[update:1000] date +"%H"
    font_size = 180
    font_family = $font Medium
    color = $fg

    position = 0, 14%
    halign = center
    valign = center
}

# MINUTES
label {
    monitor =
    text = cmd[update:1000] date +"%M"
    font_size = 180
    font_family = $font Medium
    color = $fg

    position = 0, 5%
    halign = center
    valign = center
}

# DAY
label {
    monitor =
    text = cmd[update:60000] date +"%A"
    font_size = 32
    font_family = $font Semibold
    color = $fg

    position = 0, -1.5%
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%-d %B"
    font_size = 26
    font_family = $font
    color = $fg_dim

    position = 0, -3.9%
    halign = center
    valign = center
}

# PASSWORD (220x40 logical capsule, 1px edge)
input-field {
    monitor =
    size = 440, 80
    rounding = -1
    outline_thickness = 2
    inner_color = rgba(255, 255, 255, 0.15)
    outer_color = rgba(255, 255, 255, 0.30)
    check_color = rgba(10, 132, 255, 0.85)
    fail_color = rgba(255, 69, 58, 0.85)
    font_color = $fg
    font_family = $font

    fade_on_empty = false
    placeholder_text = <span foreground="##ffffffb3">Enter Password</span>
    fail_text = $PAMFAIL
    dots_size = 0.20
    dots_spacing = 0.40
    dots_center = true

    position = 0, 11%
    halign = center
    valign = bottom
}
