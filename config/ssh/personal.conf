# Personal SSH hosts. Tracked in the public dotfiles repo.
# Symlinked to ~/.ssh/config.d/personal.conf by install/steps/30-dotfiles.sh.

Host github.com
  Hostname ssh.github.com
  Port 443
  IdentityFile ~/.ssh/id_ed25519
  AddKeysToAgent yes
  UseKeychain yes

Host hetzner
  Hostname mirekng.com
  User root
  RemoteForward 18339 127.0.0.1:18339
  ControlMaster no
  ControlPath none

Host work
  Hostname home.mirekng.com
  User binh
  Port 222
  IdentityFile ~/.ssh/id_ed25519
  AddKeysToAgent yes
  UseKeychain yes
  RemoteForward 18339 127.0.0.1:18339
  ServerAliveInterval 30
  ServerAliveCountMax 6
  TCPKeepAlive no
  # Connection multiplexing. The original config repeated ControlMaster with
  # conflicting values; ssh takes the FIRST one, so `auto` was what applied.
  ControlMaster auto
  ControlPath ~/.ssh/cm-%r@%h:%p
  ControlPersist 4h
